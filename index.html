<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: sans-serif; background: #0f172a; color: #e2e8f0; }
    .hidden { display: none !important; }
    .main-content { padding: 30px; max-width: 800px; margin: auto; }
    .form-section { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155;}
    input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;}
    button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;}
    .btn-edit-mode { background: #f59e0b; margin-bottom: 20px; }
    .btn-submit { background: #10b981; font-size: 16px;}
    .photo-preview { width: 120px; height: 160px; border: 2px dashed #334155; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0f172a; margin-top: 10px; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div class="main-content">
    <h2 id="judul-form">Input Data Baru</h2>
    
    <!-- TOMBOL GANTI MODE -->
    <button class="btn-edit-mode" onclick="toggleEditMode()" id="btn-toggle-mode">
      <i class="fas fa-search"></i> Ganti ke Mode Edit Data
    </button>

    <!-- KOTAK PENCARIAN (HANYA MUNCUL SAAT EDIT) -->
    <div id="box-pencarian" class="form-section hidden">
      <h3>Cari Data Siswa</h3>
      <label>Masukkan NIS Siswa yang ingin diedit:</label>
      <input type="number" id="search_nis" placeholder="Ketik NIS...">
      <button onclick="cariSiswa()" id="btn-cari"><i class="fas fa-search"></i> Cari Data</button>
    </div>

    <!-- FORM UTAMA -->
    <form id="formBukuInduk" onsubmit="kirimData(event)">
      <div class="form-section">
        <label>Pas Foto Siswa (Maks 5MB)</label>
        <input type="file" id="in_foto" accept="image/png, image/jpeg" onchange="previewFoto(event)">
        <div id="foto-preview-box" class="photo-preview">Belum ada foto</div>
        <input type="hidden" id="foto_base64">
        
        <label>Nama Lengkap</label>
        <input type="text" id="in_nama" required>
        
        <label>NIS</label>
        <input type="number" id="in_nis" required>
        
        <label>NISN</label>
        <input type="number" id="in_nisn" required>
        
        <label>Kelas</label>
        <select id="in_kelas" required>
          <option value="">-- Pilih --</option>
          <option value="1A">1A</option><option value="2A">2A</option>
        </select>
      </div>
      
      <button type="submit" id="btn-submit" class="btn-submit">
        <i class="fas fa-save"></i> SIMPAN DATA BARU
      </button>
    </form>
  </div>

  <script>
    var modeAplikasi = 'input'; // Default adalah input baru

    // FUNGSI GANTI MODE (INPUT / EDIT)
    function toggleEditMode() {
      const boxCari = document.getElementById('box-pencarian');
      const btnToggle = document.getElementById('btn-toggle-mode');
      const judul = document.getElementById('judul-form');
      const btnSubmit = document.getElementById('btn-submit');
      const inputNis = document.getElementById('in_nis');

      if (modeAplikasi === 'input') {
        modeAplikasi = 'edit';
        boxCari.classList.remove('hidden');
        btnToggle.innerHTML = "<i class='fas fa-plus'></i> Kembali ke Mode Input Baru";
        btnToggle.style.background = "#3b82f6";
        judul.innerText = "Edit Data Siswa";
        btnSubmit.innerHTML = "<i class='fas fa-save'></i> UPDATE DATA SISWA";
        btnSubmit.style.background = "#f59e0b";
        inputNis.readOnly = true; // NIS tidak boleh diubah saat edit
      } else {
        modeAplikasi = 'input';
        boxCari.classList.add('hidden');
        btnToggle.innerHTML = "<i class='fas fa-search'></i> Ganti ke Mode Edit Data";
        btnToggle.style.background = "#f59e0b";
        judul.innerText = "Input Data Baru";
        btnSubmit.innerHTML = "<i class='fas fa-save'></i> SIMPAN DATA BARU";
        btnSubmit.style.background = "#10b981";
        inputNis.readOnly = false;
        document.getElementById('formBukuInduk').reset();
        document.getElementById('foto-preview-box').innerHTML = "Belum ada foto";
      }
    }

    // FUNGSI CARI DATA (UNTUK EDIT)
    function cariSiswa() {
      const nisDicari = document.getElementById('search_nis').value;
      if(!nisDicari) return alert("Masukkan NIS dulu!");
      
      const btnCari = document.getElementById('btn-cari');
      btnCari.innerText = "Mencari...";
      
      // Memanggil fungsi cari di GAS (tanpa CORS!)
      google.script.run.withSuccessHandler(function(hasil) {
        btnCari.innerHTML = "<i class='fas fa-search'></i> Cari Data";
        if (hasil.ketemu) {
          document.getElementById('in_nama').value = hasil.nama;
          document.getElementById('in_nis').value = hasil.nis;
          document.getElementById('in_nisn').value = hasil.nisn;
          document.getElementById('in_kelas').value = hasil.kelas;
          alert("Data ditemukan! Silakan edit di bawah.");
        } else {
          alert("Data dengan NIS " + nisDicari + " tidak ditemukan!");
        }
      }).cariDataSiswa(nisDicari);
    }

    // FUNGSI PREVIEW FOTO
    function previewFoto(event) {
      const file = event.target.files[0];
      if (file) {
        if (file.size > 5242880) return alert("Maksimal 5MB!");
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('foto-preview-box').innerHTML = `<img src="${e.target.result}">`;
          document.getElementById('foto_base64').value = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }

    // FUNGSI KIRIM DATA (INPUT / UPDATE)
    function kirimData(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.innerText = "Menyimpan ke Database...";
      btn.disabled = true;

      const dataSiswa = {
        mode: modeAplikasi,
        nama: document.getElementById('in_nama').value,
        nis: document.getElementById('in_nis').value,
        nisn: document.getElementById('in_nisn').value,
        kelas: document.getElementById('in_kelas').value,
        fotoBase64: document.getElementById('foto_base64').value
      };

      // Memanggil fungsi simpan di GAS
      google.script.run.withSuccessHandler(function(response) {
        alert(response.pesan); // Menampilkan pesan sukses atau ditolak (karena ganda)
        if (response.status === "sukses") {
          document.getElementById('formBukuInduk').reset();
          document.getElementById('foto-preview-box').innerHTML = "Belum ada foto";
          document.getElementById('foto_base64').value = "";
        }
        btn.innerHTML = modeAplikasi === 'input' ? "<i class='fas fa-save'></i> SIMPAN DATA BARU" : "<i class='fas fa-save'></i> UPDATE DATA SISWA";
        btn.disabled = false;
      }).prosesDataSiswa(dataSiswa);
    }
  </script>
</body>
</html>
