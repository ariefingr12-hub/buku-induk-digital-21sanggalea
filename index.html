<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal SANG21</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* DESAIN TAMPILAN */
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .hidden { display: none !important; }
    
    /* Desain Kotak Login */
    .login-container { background-color: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155; }
    .logo-icon { font-size: 45px; color: #3b82f6; margin-bottom: 15px; }
    .title { font-size: 26px; font-weight: bold; margin: 0 0 5px 0; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 30px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group input { width: 100%; padding: 15px; border-radius: 10px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; font-size: 15px; }
    .input-group input:focus { border-color: #3b82f6; outline: none; }
    .btn-login { width: 100%; padding: 15px; border-radius: 10px; background-color: #2563eb; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-login:hover { background-color: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 14px; margin-top: 15px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }

    /* Desain Dashboard (Setelah Login) */
    .app-container { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
    .navbar { background-color: #1e293b; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .btn-logout { background-color: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
    .form-container { background-color: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; }
    .btn-submit { background-color: #10b981; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ================= LAYAR LOGIN ================= -->
  <div id="login-view" class="login-container">
    <i class="fas fa-fingerprint logo-icon"></i>
    <h1 class="title">PORTAL SANG21</h1>
    <p class="subtitle">Sistem Pendataan SDN 21 Sanggalea</p>
    
    <form onsubmit="masukAplikasi(event)">
      <div class="input-group">
        <input type="text" id="username" placeholder="Username" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
      </div>
      <button type="submit" id="btn-login" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Masuk Sistem
      </button>
      <div id="error-msg" class="error-msg">Username atau Password salah!</div>
    </form>
  </div>

  <!-- ================= LAYAR DASHBOARD ================= -->
  <div id="app-layout" class="app-container hidden">
    
    <div class="navbar">
      <div>
        <h2 style="margin:0; font-size: 20px;">PORTAL SANG21</h2>
        <span id="user-role" style="color: #3b82f6; font-size: 14px;"></span>
      </div>
      <button class="btn-logout" onclick="keluarAplikasi()">
        <i class="fas fa-power-off"></i> Keluar
      </button>
    </div>

    <div class="form-container">
      <h3 style="margin-top:0; border-bottom: 1px solid #334155; padding-bottom: 15px;">Form Input Data Siswa</h3>
      <form id="formSiswa" onsubmit="kirimData(event)">
        
        <div class="form-group">
          <label>Pilih Kelas</label>
          <select id="in_kelas" required>
            <option value="">-- Pilih Kelas --</option>
            <option value="1A">Kelas 1A</option>
            <option value="1B">Kelas 1B</option>
            <option value="2A">Kelas 2A</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Lengkap Siswa</label>
          <input type="text" id="in_nama" required>
        </div>

        <div class="form-group">
          <label>NISN</label>
          <input type="number" id="in_nisn" required>
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Tempat Lahir</label>
            <input type="text" id="in_tempatLahir">
          </div>
          <div style="flex: 1;">
            <label>Tanggal Lahir</label>
            <input type="date" id="in_tglLahir">
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <i class="fas fa-paper-plane"></i> Simpan Data Siswa
        </button>
      </form>
    </div>

  </div>

  <!-- ================= KODE LOGIKANYA ================= -->
  <script>
    // URL Database Google Script Anda
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwoMJzIIjcLTaVtX-Eslnf3__HKp2IbXSqjiiqlhm89lGsLb55PbE0_odCMRcigBSOo/exec";

    // Fungsi Login Paling Aman
    function masukAplikasi(event) {
      event.preventDefault(); // Mencegah loading layar
      
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('error-msg');
      
      // Ubah tampilan tombol
      btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Authenticating...";
      btn.disabled = true;
      err.style.display = 'none';

      // Cek akun secara langsung (jauh lebih cepat dan anti-error)
      setTimeout(() => {
        if (user === "admin" && pass === "admin123") {
          bukaDashboard("Guru / Admin");
        } else if (user === "ortu" && pass === "ortu123") {
          bukaDashboard("Orang Tua Wali");
        } else {
          // Jika salah password
          err.style.display = 'block';
          btn.innerHTML = "<i class='fas fa-sign-in-alt'></i> Masuk Sistem";
          btn.disabled = false;
        }
      }, 800); 
    }

    function bukaDashboard(namaAkses) {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-layout').classList.remove('hidden');
      document.getElementById('user-role').innerHTML = `<i class="fas fa-check-circle"></i> Login sebagai: ${namaAkses}`;
      
      // Kembalikan tombol login seperti semula untuk nanti
      document.getElementById('btn-login').innerHTML = "<i class='fas fa-sign-in-alt'></i> Masuk Sistem";
      document.getElementById('btn-login').disabled = false;
    }

    function keluarAplikasi() {
      document.getElementById('app-layout').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    // Fungsi Kirim Data ke Google Sheets (Anti-CORS Blokir)
    async function kirimData(event) {
      event.preventDefault();
      
      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Menyimpan ke Database...";
      btnSubmit.disabled = true;

      // Ambil data dari kotak isian
      const dataDikirim = {
        action: 'simpan',
        kelas: document.getElementById('in_kelas').value,
        nama: document.getElementById('in_nama').value,
        nisn: document.getElementById('in_nisn').value,
        tempatLahir: document.getElementById('in_tempatLahir').value,
        tglLahir: document.getElementById('in_tglLahir').value,
        // Kolom yang dikosongkan sementara bisa ditambahkan sendiri formnya
        jk: "-", agama: "-", alamat: "-", namaAyah: "-", namaIbu: "-", pekerjaan: "-", noHp: "-"
      };

      try {
        // Tembak data ke Google Script
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors', // Ini rahasianya agar tidak diblokir Vercel
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataDikirim)
        });

        alert("SUKSES! Data siswa berhasil dikirim ke Google Sheets.");
        document.getElementById('formSiswa').reset(); // Bersihkan form
        
      } catch (error) {
        alert("Gagal mengirim data. Pastikan ada koneksi internet.");
      }

      // Kembalikan tombol seperti semula
      btnSubmit.innerHTML = "<i class='fas fa-paper-plane'></i> Simpan Data Siswa";
      btnSubmit.disabled = false;
    }
  </script>

</body>
</html>
