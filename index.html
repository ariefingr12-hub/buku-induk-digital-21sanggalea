<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Buku Induk SANG21</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* DESAIN DASAR */
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: #e2e8f0; }
    .hidden { display: none !important; }
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-container { background: #1e293b; padding: 40px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155; }
    .login-container input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; }
    .btn-login { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background-color: #1e293b; padding: 20px 0; border-right: 1px solid #334155; }
    .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; text-align: center; }
    .menu-item { padding: 12px 20px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    .menu-item:hover, .menu-item.active { background-color: #3b82f6; color: white; border-left: 4px solid white; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
    .form-section { background: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
    .form-section h3 { margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; color: #3b82f6; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; }
    .btn-submit { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    .photo-preview { width: 120px; height: 160px; border: 2px dashed #334155; display: flex; align-items: center; justify-content: center; margin-top: 10px; overflow: hidden; background: #0f172a; color: #64748b; font-size: 12px; text-align: center; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <!-- VIEW LOGIN -->
  <div id="login-view" class="login-wrapper">
    <div class="login-container">
      <h2 style="margin-top:0;"><i class="fas fa-book" style="color:#3b82f6;"></i> BUKU INDUK</h2>
      <p style="color:#94a3b8; font-size:14px;">SDN 21 Sanggalea</p>
      <form onsubmit="masukAplikasi(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-login">Masuk Aplikasi</button>
      </form>
    </div>
  </div>

  <!-- VIEW DASHBOARD -->
  <div id="app-layout" class="app-container hidden">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3 style="margin:0; color:#3b82f6;">SANG21</h3>
        <span id="user-role" style="font-size: 12px; color:#10b981;"></span>
      </div>
      <div class="menu-item active"><i class="fas fa-user-plus"></i> Input / Tambah Data</div>
      <div class="menu-item"><i class="fas fa-edit"></i> Edit Data Siswa</div> <!-- Menu Edit -->
      <div class="menu-item"><i class="fas fa-users"></i> Daftar Siswa</div>
      <div class="menu-item" style="color:#ef4444;" onclick="keluarAplikasi()"><i class="fas fa-power-off"></i> Keluar</div>
    </div>

    <!-- KONTEN -->
    <div class="main-content">
      <h2>Input Buku Induk Siswa</h2>
      <form id="formBukuInduk" onsubmit="kirimData(event)">
        
        <div class="form-section">
          <h3>Data Utama & Foto Siswa</h3>
          
          <div class="form-group">
            <label>Pas Foto Siswa (Maksimal 5MB, Format: JPG/PNG)</label>
            <input type="file" id="in_foto" accept="image/png, image/jpeg" onchange="previewFoto(event)">
            <div id="foto-preview-box" class="photo-preview">Belum ada foto</div>
            <input type="hidden" id="foto_base64"> <!-- Tempat menyimpan foto sementara -->
          </div>

          <div class="form-group">
            <label>Nama Lengkap Siswa</label>
            <input type="text" id="in_nama" required>
          </div>
          
          <div class="grid-2">
            <!-- TAMBAHAN NIS -->
            <div class="form-group">
              <label>NIS (Nomor Induk Siswa)</label>
              <input type="number" id="in_nis" required>
            </div>
            <div class="form-group">
              <label>NISN (Nomor Induk Siswa Nasional)</label>
              <input type="number" id="in_nisn" required>
            </div>
          </div>
          <div class="form-group">
            <label>Pilih Kelas</label>
            <select id="in_kelas" required>
              <option value="">-- Pilih Kelas --</option>
              <option value="1A">Kelas 1A</option><option value="1B">Kelas 1B</option>
              <option value="2A">Kelas 2A</option><option value="2B">Kelas 2B</option>
            </select>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <i class="fas fa-save"></i> SIMPAN BUKU INDUK
        </button>

      </form>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwoMJzIIjcLTaVtX-Eslnf3__HKp2IbXSqjiiqlhm89lGsLb55PbE0_odCMRcigBSOo/exec";

    function masukAplikasi(event) {
      event.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      
      if (u === "admin" && p === "admin123") {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('user-role').innerText = "Akses: Administrator";
      } else if (u === "ortu" && p === "ortu123") {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('user-role').innerText = "Akses: Orang Tua";
      } else {
        alert("Akses Ditolak!");
      }
    }

    function keluarAplikasi() {
      document.getElementById('app-layout').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    // FUNGSI UPLOAD & CEK UKURAN FOTO (MAKS 5MB)
    function previewFoto(event) {
      const file = event.target.files[0];
      const previewBox = document.getElementById('foto-preview-box');
      const hiddenInput = document.getElementById('foto_base64');
      
      if (file) {
        // Cek ukuran (5MB = 5 * 1024 * 1024 bytes)
        if (file.size > 5242880) {
          alert("Peringatan: Ukuran foto terlalu besar! Maksimal 5MB. Silakan kompres foto Anda terlebih dahulu.");
          event.target.value = ""; // Kosongkan pilihan file
          previewBox.innerHTML = "Belum ada foto";
          hiddenInput.value = "";
          return;
        }

        // Convert foto ke Base64 agar bisa dikirim ke Google Script
        const reader = new FileReader();
        reader.onload = function(e) {
          previewBox.innerHTML = `<img src="${e.target.result}">`;
          hiddenInput.value = e.target.result; // Simpan teks panjang fotonya di sini
        }
        reader.readAsDataURL(file);
      }
    }

    async function kirimData(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> MENYIMPAN DATA...";
      btn.disabled = true;

      const dataSiswa = {
        action: 'simpan',
        nama: document.getElementById('in_nama').value,
        nis: document.getElementById('in_nis').value,
        nisn: document.getElementById('in_nisn').value,
        kelas: document.getElementById('in_kelas').value,
        fotoBase64: document.getElementById('foto_base64').value // Mengirim foto ke server
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataSiswa)
        });
        alert("BERHASIL! Data Buku Induk (termasuk foto jika ada) dikirim.");
        document.getElementById('formBukuInduk').reset();
        document.getElementById('foto-preview-box').innerHTML = "Belum ada foto";
      } catch (error) {
        alert("Gagal. Cek koneksi internet Anda.");
      }
      
      btn.innerHTML = "<i class='fas fa-save'></i> SIMPAN BUKU INDUK";
      btn.disabled = false;
    }
  </script>
</body>
</html>
